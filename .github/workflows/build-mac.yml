# macOS build: tests, TimeTracker-X.Y.Z-mac.dmg and screenshots of every window.
# The dmg is a workflow artifact; it goes into the GitHub Release by hand, after a check on a real Mac.
name: macOS build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt pillow

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: PYTHON=python sh build_mac.sh

      - name: Screenshots
        run: python -X utf8 tests/screenshots.py screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-mac
          path: release/v*/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
